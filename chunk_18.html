
            <script>
                function openModal() {
                  var modal = document.getElementById('comments-modal');
                  var body = document.getElementById('modal-body');
                  body.innerHTML = '<p>Os comentários ficam disponíveis por tema selecionado.</p>';
                  modal.classList.add('active');
                }
                function closeModal(event) {
                  if (!event || event.target === event.currentTarget) document.getElementById('comments-modal').classList.remove('active');
                }
            </script>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Painel NPS MetLife × iFood</title></head><body><div id="app"></div><script>(async()=>{const r=document.getElementById('app');let a=[];for(let i=1;i<=20;i++){let n=`chunk_${String(i).padStart(2,'0')}.html`,x=await fetch(n,{cache:'no-store'});if(!x.ok)throw Error(n);a.push(await x.text())}r.innerHTML=a.join('')})().catch(()=>document.getElementById('app').textContent='Não foi possível carregar o painel.')</script></body></html>

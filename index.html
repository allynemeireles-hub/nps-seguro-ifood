<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel NPS — Sinistros iFood × MetLife</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;padding:24px} .status{max-width:760px;margin:auto;padding:20px;border:1px solid #cbd5e1;border-radius:12px;background:white} .progress{height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden}.bar{height:100%;width:0;background:#0ea5e9;transition:width .2s}
  </style>
</head>
<body>
  <div class="status">
    <h1>Carregando Painel NPS</h1>
    <p id="status">0%</p><div class="progress"><div class="bar" id="bar"></div></div>
  </div>
<script>
(async()=>{
 const chunks=['chunk_01.html','chunk_02.html','chunk_03.html','chunk_04.html','chunk_05.html','chunk_06.html','chunk_07.html','chunk_08.html','chunk_09.html','chunk_10.html','chunk_11.html','chunk_12.html','chunk_13.html','chunk_14.html','chunk_15.html','chunk_16.html','chunk_17.html','chunk_18.html','chunk_19.html','chunk_20.html','chunk_21.html','chunk_22.html','chunk_23.html','chunk_24.html','chunk_25.html','chunk_26.html','chunk_27.html','chunk_28.html'];
 let html=''; for(let i=0;i<chunks.length;i++){const r=await fetch(chunks[i]);if(!r.ok)throw new Error('Falha ao carregar '+chunks[i]);html+=await r.text();const pct=Math.round((i+1)/chunks.length*100);document.getElementById('status').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%';}
 document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('status').textContent=e.message;});
</script>
</body>
</html>

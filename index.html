<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel NPS — Seguro iFood</title>
    <style>
      html,body{margin:0;padding:0;background:#fff;color:#3E3D3A;font-family:Arial,sans-serif}body{min-height:100vh}.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:18px;color:#666}
    </style>
</head>
<body>
<div class="loading">Carregando painel NPS...</div>
<script>
(async()=>{const files=["chunk_01.html","chunk_02.html","chunk_03.html","chunk_04.html","chunk_05.html","chunk_06.html","chunk_07.html","chunk_08.html","chunk_09.html","chunk_10.html","chunk_11.html","chunk_12.html","chunk_13.html","chunk_14.html","chunk_15.html","chunk_16.html","chunk_17.html","chunk_18.html","chunk_19.html","chunk_20.html"];try{const html=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f+": "+r.status);return r.text()})));document.open();document.write(html.join(""));document.close()}catch(e){document.body.innerHTML='<div class="loading">Não foi possível carregar o painel. '+e.message+'</div>'}})();
</script>
</body>
</html>

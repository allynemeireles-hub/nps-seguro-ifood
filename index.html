<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel NPS MetLife × iFood</title>
  <style>
    body { margin: 0; background: #f1f5f9; font-family: system-ui; }
    #loading { padding: 2rem; text-align:center; color:#64748b; }
    #root { max-width: 1400px; margin: 0 auto; }
  </style>
</head>
<body>
<div id="loading">Carregando painel...</div>
<div id="root"></div>
<script>
const CHUNKS = ['chunk_01.html','chunk_02.html','chunk_03.html','chunk_04.html','chunk_05.html','chunk_06.html','chunk_07.html','chunk_08.html','chunk_09.html','chunk_10.html','chunk_11.html','chunk_12.html','chunk_13.html','chunk_14.html','chunk_15.html','chunk_16.html','chunk_17.html','chunk_18.html','chunk_19.html','chunk_20.html'];
Promise.all(CHUNKS.map(c => fetch(c).then(r => { if (!r.ok) throw new Error(c + ' HTTP ' + r.status); return r.text(); }))).then(parts => {
  document.getElementById('root').innerHTML = parts.join('');
  document.getElementById('loading').remove();
}).catch(e => { document.getElementById('loading').textContent = 'Erro ao carregar painel: ' + e.message; });
</script>
</body>
</html>

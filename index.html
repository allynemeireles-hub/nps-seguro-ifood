<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel NPS — MetLife × iFood</title>
<style>
  html,body{margin:0;padding:0;background:#f5f7f8;color:#24343b;font-family:Arial,sans-serif}
  #app{max-width:1200px;margin:0 auto;padding:24px}
  .loading{padding:48px;text-align:center;color:#55717b}
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando Painel NPS MetLife × iFood…</div></div>
<script>
(async function(){
  const root=document.getElementById('app');
  try {
    const files=['chunk_01.html','chunk_02.html','chunk_03.html','chunk_04.html','chunk_05.html','chunk_06.html','chunk_07.html','chunk_08.html','chunk_09.html','chunk_10.html','chunk_11.html','chunk_12.html','chunk_13.html','chunk_14.html','chunk_15.html','chunk_16.html','chunk_17.html','chunk_18.html','chunk_19.html','chunk_20.html'];
    const pieces=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+': '+r.status);return r.text()}));
    root.innerHTML=pieces.join('');
    window.dispatchEvent(new Event('DOMContentLoaded'));
  } catch(e) { root.innerHTML='<div class="loading">Não foi possível carregar o painel. '+String(e.message||e)+'</div>'; }
})();
</script>
</body>
</html>

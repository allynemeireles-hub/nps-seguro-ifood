<!DOCTYPE html>
<html lang="pt-BR"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel NPS MetLife × iFood</title>
  <style>body{margin:0;background:#f1f5f9;font-family:system-ui}#loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;color:#475569}.spinner{width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head><body><div id="loading"><div class="spinner"></div><div>Carregando painel...</div></div>
<script>
(async()=>{try{const urls=[...Array(20)].map((_,i)=>`chunk_${String(i+1).padStart(2,'0')}.html`);const parts=await Promise.all(urls.map(u=>fetch(u).then(r=>{if(!r.ok)throw Error(u+': '+r.status);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.getElementById('loading').innerHTML='<p>Não foi possível carregar o painel.</p><p>'+e.message+'</p>'}})();
</script></body></html>

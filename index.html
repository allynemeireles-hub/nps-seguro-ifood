<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel NPS MetLife × iFood</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
#loading{text-align:center;padding:40px}#loading h1{font-size:22px;margin-bottom:12px}#loading p{color:#94a3b8}
#panel{width:100%;min-height:100vh}
iframe{display:block;width:100%;border:0;min-height:100vh}
</style>
</head>
<body>
<div id="loading"><h1>Carregando painel NPS...</h1><p>MetLife × iFood</p></div>
<div id="panel"></div>
<script>
const chunks = ["chunk_01.html","chunk_02.html","chunk_03.html","chunk_04.html","chunk_05.html","chunk_06.html","chunk_07.html","chunk_08.html","chunk_09.html","chunk_10.html","chunk_11.html","chunk_12.html","chunk_13.html","chunk_14.html","chunk_15.html","chunk_16.html","chunk_17.html","chunk_18.html","chunk_19.html","chunk_20.html"];
Promise.all(chunks.map(name=>fetch(name).then(r=>{if(!r.ok)throw new Error(name+" "+r.status);return r.text()})))
.then(parts=>{document.getElementById("loading").remove();document.getElementById("panel").innerHTML=parts.join("")})
.catch(error=>{document.getElementById("loading").innerHTML='<h1>Erro ao carregar painel</h1><p>'+error.message+'</p>'});
</script>
</body>
</html>

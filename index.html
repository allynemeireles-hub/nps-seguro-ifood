<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel NPS — MetLife × iFood</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#333}#app{padding:20px;max-width:1200px;margin:auto}#loading{text-align:center;color:#666;padding:40px}iframe{display:none}</style>
</head>
<body>
<div id="app"><div id="loading">Carregando Painel NPS...</div></div>
<script>
(async()=>{try{
const parts=['chunk_01.html','chunk_02.html','chunk_03.html','chunk_04.html','chunk_05.html','chunk_06.html','chunk_07.html','chunk_08.html','chunk_09.html','chunk_10.html','chunk_11.html','chunk_12.html','chunk_13.html','chunk_14.html','chunk_15.html','chunk_16.html','chunk_17.html','chunk_18.html','chunk_19.html','chunk_20.html'];
const html=await Promise.all(parts.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p+' '+r.status);return r.text()})));
document.open();document.write(html.join(''));document.close();
}catch(e){document.getElementById('loading').textContent='Erro ao carregar o painel: '+e.message;console.error(e)}})();
</script>
</body>
</html>

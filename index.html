<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel NPS MetLife × iFood</title>
<style>html,body{margin:0;padding:0;background:#fff;font-family:Arial,sans-serif}#app{width:100%;min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<script>
(async function(){
  const root=document.getElementById('app');
  const parts=[];
  const total=20;
  for(let i=1;i<=total;i++){
    const name=`chunk_${String(i).padStart(2,'0')}.html`;
    const r=await fetch(name,{cache:'no-store'});
    if(!r.ok) throw new Error(`Falha ao carregar ${name}: HTTP ${r.status}`);
    parts.push(await r.text());
  }
  root.innerHTML=parts.join('');
})().catch(err=>{
  document.getElementById('app').innerHTML='<p style="padding:24px;color:#b42318">Não foi possível carregar o painel.</p>';
  console.error(err);
});
</script>
</body>
</html>


    <div id="modal" class="modal" onclick="fecharModal()"><div class="modal-content" onclick="event.stopPropagation()"><div class="modal-header"><h3 id="modal-titulo">Comentários</h3><span class="modal-close" onclick="fecharModal()">&times;</span></div><div class="modal-body"><div style="margin-bottom:20px"><div class="section-title section-promotores">Promotores (nota 9–10)</div><div id="modal-promotores"></div></div><div><div class="section-title section-detratores">Detratores (nota 0–6)</div><div id="modal-detratores"></div></div></div></div></div>
    <script>
        const COMMENTS_DATA = {};
        function abrirModal(tema) {
            document.getElementById('modal-titulo').textContent = tema;
            const data = COMMENTS_DATA[tema] || {promotores: [], detratores: []};
            const promDiv = document.getElementById('modal-promotores');
            const detDiv = document.getElementById('modal-detratores');
            promDiv.innerHTML = data.promotores.length ? data.promotores.map(c => `<div class="comment"><div class="comment-meta">NPS ${c.nps} · ${c.cov} · ${c.mes}</div><div class="comment-text">${c.texto}</div></div>`).join('') : '<p style="font-size:12px;color:#94a3b8">Nenhum comentário de promotores nesta categoria.</p>';
            detDiv.innerHTML = data.detratores.length ? data.detratores.map(c => `<div class="comment"><div class="comment-meta">NPS ${c.nps} · ${c.cov} · ${c.mes}</div><div class="comment-text">${c.texto}</div></div>`).join('') : '<p style="font-size:12px;color:#94a3b8">Nenhum comentário de detratores nesta categoria.</p>';
            document.getElementById('modal').classList.add('active');
        }
        function fecharModal() { document.getElementById('modal').classList.remove('active'); }
    </script>
</body>
</html>

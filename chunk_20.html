
    <script>
        const COMMENTS_DATA = {};
        function abrirModal(tema) {
            document.getElementById('modal-titulo').textContent = tema;
            const data = COMMENTS_DATA[tema] || {promotores: [], detratores: []};
            document.getElementById('modal-promotores').innerHTML = data.promotores.length ? data.promotores.map(c => `<div class="comment"><div class="comment-meta">NPS ${c.nps} · ${c.cov} · ${c.mes}</div><div class="comment-text">${c.texto}</div></div>`).join('') : '<p style="font-size:12px;color:#94a3b8">Nenhum comentário de promotores nesta categoria.</p>';
            document.getElementById('modal-detratores').innerHTML = data.detratores.length ? data.detratores.map(c => `<div class="comment"><div class="comment-meta">NPS ${c.nps} · ${c.cov} · ${c.mes}</div><div class="comment-text">${c.texto}</div></div>`).join('') : '<p style="font-size:12px;color:#94a3b8">Nenhum comentário de detratores nesta categoria.</p>';
            document.getElementById('modal').classList.add('active');
        }
        function fecharModal() { document.getElementById('modal').classList.remove('active'); }
    </script>
</body>
</html>



        </div>
    </div>
    <script>
      document.querySelectorAll('.btn').forEach(btn => btn.addEventListener('click', () => document.getElementById('comments-modal')?.classList.add('active')));
      document.querySelectorAll('.modal').forEach(modal => modal.addEventListener('click', event => { if (event.target === modal) modal.classList.remove('active'); }));
    </script>
</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel NPS MetLife × iFood</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:#f4f7f8; color:#16363d; line-height:1.5; }
.container { max-width:1200px; margin:0 auto; padding:24px; }
h1 { font-size:28px; color:#007c83; margin-bottom:6px; }
.subtitle { color:#547078; margin-bottom:24px; }
.card { background:#fff; border-radius:12px; box-shadow:0 2px 10px #0b596015; padding:18px; margin-bottom:18px; }
.kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.kpi-label { color:#547078; font-size:13px; }
.kpi-value { font-size:30px; font-weight:700; color:#007c83; }
@media(max-width:760px){.container{padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<h1>Painel NPS MetLife × iFood</h1>
<p class="subtitle">Análise da experiência dos entregadores na parceria Seguro iFood</p>
<div class="card">
<div class="kpis">
<div><div class="kpi-label">NPS</div><div class="kpi-value">13</div></div>
<div><div class="kpi-label">Respondentes</div><div class="kpi-value">467</div></div>
<div><div class="kpi-label">Promotores</div><div class="kpi-value">36%</div></div>
<div><div class="kpi-label">Detratores</div><div class="kpi-value">23%</div></div>
</div>
</div>

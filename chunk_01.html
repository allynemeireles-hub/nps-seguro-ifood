<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel NPS — Sinistros iFood × MetLife</title>
<style>html,body{margin:0;padding:0;background:#fff}#app{min-height:100vh}#loading{font-family:Arial,sans-serif;text-align:center;padding:48px;color:#475569}</style>
</head>
<body>
<div id="app"><div id="loading">Carregando painel…</div></div>
<script>
const chunks = ["chunk_01.html", "chunk_02.html", "chunk_03.html", "chunk_04.html", "chunk_05.html", "chunk_06.html", "chunk_07.html", "chunk_08.html", "chunk_09.html", "chunk_10.html", "chunk_11.html", "chunk_12.html", "chunk_13.html", "chunk_14.html", "chunk_15.html", "chunk_16.html", "chunk_17.html", "chunk_18.html", "chunk_19.html", "chunk_20.html"];
Promise.all(chunks.map(url => fetch(url).then(r => { if (!r.ok) throw new Error(url + ': ' + r.status); return r.text(); })))
  .then(parts => { document.open(); document.write(parts.join('')); document.close(); })
  .catch(err => { document.getElementById('app').innerHTML = '<div id="loading">Não foi possível carregar o painel.</div>'; console.error(err); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel NPS MetLife × iFood — Ago./26</title>
<style>
:root{--teal:#157a8a;--ink:#263238;--muted:#6b7c83;--bg:#f3f6f7;--card:#fff;--coral:#c9694e;--green:#4d927a;--line:#dfe7e9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}a{color:var(--teal)}.wrap{max-width:1180px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#e8f3f4,#fff);padding:28px;border-radius:18px;margin-bottom:18px}.eyebrow{color:var(--teal);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px}.title{font-size:30px;font-weight:700;margin:8px 0}.sub{color:var(--muted);font-size:15px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.label{color:var(--muted);font-size:12px}.value{font-size:28px;font-weight:700;margin-top:8px;color:var(--teal)}.section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}.section h2{margin:0 0 14px;color:var(--teal);font-size:20px}.notice{background:#fff4ef;border-left:4px solid var(--coral);padding:12px;border-radius:8px;color:#704033}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px}}
</style>
</head>
<body><div class="wrap">
<header class="hero"><div class="eyebrow">MetLife × iFood · NPS relacional</div><div class="title">Painel NPS</div><div class="sub">Visão consolidada com dados atualizados até 21/08/2026.</div></header>
<section class="cards"><div class="card"><div class="label">NPS ago./26</div><div class="value">15</div></div><div class="card"><div class="label">Respondentes</div><div class="value">467</div></div><div class="card"><div class="label">Promotores</div><div class="value">49%</div></div><div class="card"><div class="label">Detratores</div><div class="value">34%</div></div></section>
<section class="section"><h2>Visão geral</h2><p class="notice">O painel apresenta a composição do NPS, tendências e recortes de jornada, cobertura e comentários.</p></section>

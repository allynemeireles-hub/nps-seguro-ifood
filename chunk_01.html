<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel NPS MetLife × iFood</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; background:#f8fafc; color:#1e293b; padding:20px; }
        .container { max-width:1200px; margin:auto; }
        header { text-align:center; padding:20px 0 18px; }
        header h1 { color:#0f766e; font-size:28px; margin-bottom:6px; }
        header p { color:#64748b; font-size:14px; }
        .card { background:white; border-radius:12px; padding:20px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
        .card-title { font-size:18px; font-weight:700; color:#0f766e; margin-bottom:16px; }
        .big-stat { text-align:center; padding:12px 0; }
        .valor { font-size:56px; font-weight:800; color:#0f766e; }
        .label { font-size:13px; color:#64748b; }
        .delta { font-size:14px; margin-top:5px; }
        .positivo { color:#15803d; }
        .distribuicao { display:flex; justify-content:center; gap:42px; margin-top:10px; }
        .dist-item { text-align:center; }
        .pct { font-size:22px; font-weight:700; }
        .prom { color:#059669; }.neu { color:#64748b; }.det { color:#be123c; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
        @media(max-width:800px){.grid-2{grid-template-columns:1fr}.distribuicao{gap:20px}}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Painel NPS MetLife × iFood</h1>
            <p>Dados disponíveis até 21/08/2026 &nbsp;·&nbsp; Ago/26 MTD</p>
        </header>
        <div class="container">
        <!-- Visão Geral -->
        <div class="card">
            <div class="card-title">Visão Geral</div>
            <div class="big-stat">
                <div class="valor">+15</div><div class="label">NPS Ago/26</div><div class="delta positivo">+3 vs Jul/26</div>
            </div>
            <div class="distribuicao"><div class="dist-item"><div class="pct prom">54%</div><div class="label">Promotores</div></div><div class="dist-item"><div class="pct neu">7%</div><div class="label">Neutros</div></div><div class="dist-item"><div class="pct det">39%</div><div class="label">Detratores</div></div></div>
        </div>
        <!-- SPLIT -->

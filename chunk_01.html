<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel NPS — Sinistros iFood × MetLife</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#0f172a}.status{padding:16px;text-align:center}</style>
</head>
<body><div class="status">Carregando painel NPS…</div><script>
(async()=>{try{const n=20,parts=[];for(let i=1;i<=n;i++){const f=`chunk_${String(i).padStart(2,'0')}.html`;const r=await fetch(f);if(!r.ok)throw new Error(f+' HTTP '+r.status);parts.push(await r.text())}document.open();document.write(parts.join(''));document.close()}catch(e){document.querySelector('.status').textContent='Falha ao carregar o painel NPS: '+e.message}})();
</script></body>
</html>
